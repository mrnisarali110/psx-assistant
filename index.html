<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PSX Assistant</title>
    <meta name="description" content="PSX alerts and a monthly investing plan. Advice only, you place the trades." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PSX Assist" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      /* Pick the theme before first paint so the splash never flashes the wrong colour. Mirrors src/lib/theme.ts. */
      (function () {
        var p = null;
        try { p = localStorage.getItem('psx-theme'); } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <style>
      /* Boot splash, shown until React mounts (React replaces #root's contents). Same look as src/components/Splash.tsx. */
      html, body { margin: 0; background: #f8fafc; }
      @media (prefers-color-scheme: dark) { html, body { background: #000; } }
      html[data-theme="light"], html[data-theme="light"] body { background: #f8fafc; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #000; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        font: 600 15px/1.2 ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; letter-spacing: -0.01em; color: #0f172a; background: #f8fafc; }
      html[data-theme="dark"] .boot { color: #f1f5f9; background: #000; }
      .boot svg { width: 64px; height: 64px; animation: boot-breathe 1.8s ease-in-out infinite; }
      .boot i { position: relative; display: block; width: 120px; height: 3px; overflow: hidden; border-radius: 3px; background: rgb(15 118 110 / 0.15); }
      .boot i::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #0f766e; animation: boot-bar 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      html[data-theme="dark"] .boot i { background: rgb(45 212 191 / 0.18); }
      html[data-theme="dark"] .boot i::after { background: #2dd4bf; }
      @keyframes boot-breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.94); opacity: 0.82; } }
      @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot svg, .boot i::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0f766e"/><polyline points="14.08,42.24 25.6,30.72 34.56,37.12 48.64,21.76" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48.64" cy="21.76" r="4.6" fill="#fff"/></svg>
        <span>PSX Assist</span>
        <i aria-hidden="true"></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
